# אינדקס פרטי מבודד — נפרד במכוון מ-~/.recoll הקנוני.
#
# הגבול: תוכן פרטי נשלף רק בפנייה מפורשת ולעולם אינו מעורבב
# בתוצאות של חיפוש טכני. אותו דפוס כמו פרויקט `reference` ב-basic-memory,
# שאינו מוזרק לעולם במכוון.
#
# 🛑 skippedNames אינו אופציונלי. נמדד 2026-09-08:
#      בלעדיו:  453s · 2,643 מסמכים (מתוך 343 קבצים) — בלע את .obsidian,
#               .claude, .agent, .opencode, .codenomad; workspace.json צף
#               כתוצאה ראשונה
#      איתו:    5.9s · 492 מסמכים
#
# שימוש:  recollq -c ~/.recoll-diary -n 5 "מונח"
# ‏phase4 C4 (2026-09-08): סשני סוכנים מפרויקטים פרטיים.
# הבידוד היה קיים ברמת הריפו (agent-sessions-export מנתב לפי נתיב) אבל
# לא ברמת החיפוש — 719 קבצים ישבו באינדקס הטכני.
topdirs = /path/to/private-vault /home/user/Projects/private-sessions
indexallfilenames = 1
# ‏meta/ הוא JSON גולמי — לא מוסיף כלום לחיפוש ורק מכפיל תוצאות.
# הנתיב השני נוסף 2026-09-08 כשפרויקט פרטי מסוים עבר למאגר הפרטי.
skippedPaths = /home/user/Projects/private-sessions/data/myhost/meta \
    "/path/to/private-vault/sessions/data/myhost/meta"
skippedNames = .obsidian .claude .agent .opencode .codenomad .smart-env .git .trash node_modules tmp

# --- הוויקי של המאגר הפרטי: frontmatter → שדות (מופע שלישי, 2026-09-08) ---
# אותו סקריפט חילוץ כמו בשני המופעים האחרים. מוגבל ל-`wiki/` —
# ‏`journal/` נכתב ביד ואין לו frontmatter, ואין טעם להריץ עליו פקודה.
# ⚠️ הסעיף על **שורש המאגר הפרטי**, לא על `wiki/`: כותרת-סעיף עם נתיב
# עברי לא נתפסה. הסקריפט מחזיר ריק לקובץ בלי frontmatter, ולכן הרצה
# על `journal/` אינה מזיקה — רק מוסיפה awk זריז לכל קובץ.
[/path/to/private-vault]
metadatacmds = ; rclmulti1 = /home/user/Projects/agents-config/scripts/recoll-md-fields.sh %f
