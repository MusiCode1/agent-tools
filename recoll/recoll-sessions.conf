# אינדקס סשני סוכנים — הופרד מהקנוני ב-phase2 C4, 2026-09-08.
#
# למה: 25,917 קבצי סשנים מול ~794 מסמכי ידע — יחס 33:1. הארכיון מכיל את
# *השיחה שבה הרנבוק נכתב*: אותם מונחים, פי כמה בנפח, ולכן מנוע שמדרג לפי
# תדירות מעדיף כל פעם את התמליל הגולמי על הזיקוק. הזיקוק נענש על תמציתיות.
#
# נמדד לפני ההפרדה: 79.9% מהתוצאות היו ארכיון, 2.5% הרנבוק המבוקש.
# ומבחן ה-frontmatter: 24/66 בשאילתה חופשית מול 59/66 עם dir: על workflows.
#
# שימוש:
#   recollq -c ~/.recoll-sessions -n 10 "מונח"          # סשנים בלבד
#   recollq -c ~/.recoll -i ~/.recoll-sessions/xapiandb "מונח"   # שניהם
#
# הסקיל `agent-sessions` מכוון לכאן.

topdirs = /home/user/.claude/projects /home/user/.claude/sessions /home/user/.claude/history.jsonl \
    /home/user/.codex/sessions /home/user/.codex/history.jsonl \
    /home/user/.codex-remote/sessions /home/user/.codex-remote/history.jsonl \
    /home/user/.cursor/projects /home/user/.cursor/chats /home/user/.cursor/acp-sessions \
    /home/user/.cline/data/sessions \
    /home/user/.pi/agent/sessions \
    /home/user/.omp/agent/sessions /home/user/.grok/sessions \
    /home/user/.gemini/antigravity-cli/brain /home/user/.gemini/antigravity-cli/history.jsonl \
    /home/user/.gemini/tmp \
    /home/user/Projects/agent-sessions\
    /home/user/Projects/.archive-agent-sessions-work

# meta/ הוא JSON מובנה, לא תוכן שיחה — הוחרג גם בקנוני מאז ומתמיד.
skippedPaths = /home/user/Projects/agent-sessions/data/myhost/meta \
    /home/user/Projects/private-sessions/data/myhost/meta

skippedNames = .git node_modules .venv __pycache__
indexallfilenames = 1
