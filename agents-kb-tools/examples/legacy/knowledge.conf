# Synthetic configuration for the knowledge.conf compatibility commands.
# Paths are relative to the instance root; overrides remain instance-local.
KB_WIKI=wiki
KB_WORKFLOWS=workflows
KB_HISTORY=history
KB_RULES=rules
KB_CATEGORIES=machines,services,projects,rules,wiki
KB_PAGE_MAX=12288
KB_SEGMENT_MAX=4096
KB_SEGMENT_FENCES=4
KB_STRUCTURAL_SECTIONS=ראו גם,תת-ישויות,See also

# --- שערי מופע: כבויים כברירת מחדל; כל מופע מדליק לפי צרכיו ---
# תקרה בבתים לפי `kind` שבפרונטמטר, בתבנית kind:bytes,… ; 0 = בלי תקרה.
# דף שהוא אוסף טענות נשאר קצר; פרוצדורה שנקראת מקצה לקצה עשויה להיות ארוכה.
# קדימות: כשהמפתח מגדיר סוג אחד לפחות הוא מחליף את KB_CATALOG_KINDS ו־KB_CATALOG_MAX,
# וסוג שאינו רשום בו מקבל KB_PAGE_MAX. ריק = KB_CATALOG_* ממשיכים לפעול כמקודם.
# דוגמה: KB_CAPS=entity:12288,catalog:32768,runbook:0
KB_CAPS=
# KB_CATALOG_KINDS=catalog
# KB_CATALOG_MAX=32768
# on = דף wiki בלי `kind:` בפרונטמטר הוא ממצא (INDEX.md פטור), כי התקרה נגזרת ממנו.
KB_REQUIRE_KIND=off
# אורך מרבי בתווים ל־description בפרונטמטר; הוא נכנס כלשונו לאינדקס הסריקה.
# README.md, INDEX.md וקובצי תיקיית הכללים פטורים. 0 = כבוי.
KB_DESC_MAX=0
# on = דף ב־wiki או ב־workflows שגופו מכיל מזהה קונקרטי חייב verified: YYYY-MM-DD.
# updated מתעד עריכה, לא אימות. history פטור, וכך גם תוכן בבלוק קוד מגודר.
# מה נחשב מזהה הוא תוכן המופע: אין תבנית ברירת מחדל, ובלי תבנית השער אינו עושה דבר.
# התחביר הוא RegExp של JavaScript. דוגמה סינתטית: KB_VERIFIED_PATTERNS=\b\d{9}\b
KB_VERIFIED_MODE=off
KB_VERIFIED_PATTERNS=

KB_MACHINE_SCOPE=demo-machine
KB_ALWAYS_MARKER=inject: always
KB_NAME_GATE=off
KB_NAME_LIST=
KB_GATE_MODE=fail
KB_ENTITIES_OUT=wiki-entities.md
KB_WORKFLOWS_INDEX=workflows/INDEX.md
