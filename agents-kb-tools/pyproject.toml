[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-kb-tools"
version = "0.1.0"
description = "Scoped agent rule summaries and knowledge tools"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
kb-rules = "kb_tools.rules:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kb_tools*"]
